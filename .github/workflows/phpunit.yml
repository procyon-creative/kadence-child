name: PHPUnit

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, mbstring, dom
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        timeout-minutes: 3
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP syntax
        run: find functions.php inc tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run unit tests
        run: composer test
