name: PHPUnit

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Run WordPress integration tests
        timeout-minutes: 3
        run: npm test

      - name: Validate Composer configuration
        run: npm run test:composer -- validate --strict

      - name: Check PHP syntax
        run: npx wp-env run cli --config=.wp-env.test.json --env-cwd=wp-content/themes/kadence-child sh -c 'find functions.php inc tests -name "*.php" -print0 | xargs -0 -n1 php -l'

      - name: Print container logs on failure
        if: failure()
        run: npx wp-env logs --config=.wp-env.test.json --watch=false

      - name: Stop WordPress
        if: always()
        run: npm run test:stop
